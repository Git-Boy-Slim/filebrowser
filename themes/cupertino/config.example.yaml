# Example snippet for the FileBrowser Quantum config.yaml.
# Copy the `frontend.styling` block (and optionally `userDefaults`).
#
# How CSS paths are resolved:
#   - The backend reads the files with os.ReadFile at startup.
#   - Relative paths are resolved from the process's WORKING DIRECTORY,
#     not from the location of config.yaml. If you start FileBrowser from
#     the directory that contains config.yaml (e.g. `cd` into it first),
#     both are the same and "./..." paths work as expected.
#   - Changes to the CSS files only take effect after a restart.
#   - A file that is missing, empty or larger than 128 KB is skipped with a
#     warning in the log ("could not read custom CSS file: ...").

# ---------------------------------------------------------------------------
# Variant A – plain binary, themes synced with git next to config.yaml
# ---------------------------------------------------------------------------
# Layout (example):
#   ~/.config/filebrowser-quantum/
#   ├── config.yaml
#   └── git/                      <- sparse checkout of this repository
#       └── themes/cupertino/...
#
# FileBrowser is started from ~/.config/filebrowser-quantum, so paths are
# relative to that directory.

frontend:
  styling:
    # Match the theme's --background to avoid a light/dark flash while loading
    lightBackground: "#f5f5f7"
    darkBackground: "#18181a"

    # Login page: no user is known there yet, so the app cannot load a user
    # theme. login.css only applies inside #login and does not affect the app
    # or other themes, so it can stay enabled permanently.
    customCSS: "./git/themes/cupertino/login.css"

    # Selectable themes (Profile → Theme & Language → "Choose your theme").
    customThemes:
      default:
        description: "Default"
        css: ""
      cupertino:
        description: "Cupertino (macOS / iOS)"
        css: "./git/themes/cupertino/theme.css"

# Optional: make Cupertino the default for new users
userDefaults:
  ui:
    customTheme: "cupertino"

# ---------------------------------------------------------------------------
# Variant B – Docker
# ---------------------------------------------------------------------------
# The official image runs in /home/filebrowser. Mount the themes folder and use
# absolute paths:
#
#   docker-compose.yaml:
#     volumes:
#       - ./themes:/home/filebrowser/themes:ro
#
#   config.yaml:
#     customCSS: "/home/filebrowser/themes/cupertino/login.css"
#     css:       "/home/filebrowser/themes/cupertino/theme.css"
