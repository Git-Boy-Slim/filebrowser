http:
  port: 8090
server:
  sources:
    - path: "./files"
      config:
        defaultEnabled: true
auth:
  methods:
    password:
      enabled: true
      adminUsername: admin
      adminPassword: admin1234
      minLength: 5
userDefaults:
  ui:
    customTheme: "cupertino"
frontend:
  styling:
    lightBackground: "#f5f5f7"
    darkBackground: "#18181a"
    customCSS: "../cupertino/login.css"
    customThemes:
      default:
        description: "Default"
        css: ""
      cupertino:
        description: "Cupertino (macOS / iOS)"
        css: "../cupertino/theme.css"
